[project]
name = "sdlc-c2"
version = "0.1.0"
description = "Component 2: contract first code generation from the design"
requires-python = ">=3.12"
dependencies = [
    "sdlc-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # The model layer, with the same four providers as C1 so the per component
    # split is a change to C2_MODEL alone: Google is this component's lane,
    # Anthropic stays wired as the fallback.
    "pydantic-ai-slim[anthropic,google,groq,openrouter]>=1.0",
    # The GitHub push and the probe reuse the client the orchestrator already
    # depends on.
    "httpx>=0.28",
]

[tool.uv.sources]
sdlc-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["c2"]
