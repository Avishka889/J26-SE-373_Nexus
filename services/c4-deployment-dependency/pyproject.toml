[project]
name = "sdlc-c4"
version = "0.1.0"
description = "Component 4: dependency update risk, deployment automation and rollback"
requires-python = ">=3.12"
dependencies = [
    "sdlc-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # The same four providers as the other three components. DeepSeek, this
    # component's lane, needs only the OpenAI client, which the openrouter
    # extra already brings; the openai extra would add tiktoken for nothing.
    "pydantic-ai-slim[anthropic,google,groq,openrouter]>=1.0",
    "httpx>=0.28",
    # The SemVer rule's two libraries: python-semver reads npm's versions,
    # which are SemVer 2.0.0, and univers orders Maven's, which are not.
    "semver>=3.1",
    "univers>=32",
    # One symbol index per run (NFR2): tree-sitter's Python bindings and the
    # grammars for what the platform generates (TypeScript, TSX, JavaScript)
    # and what BUMP's clients are written in (Java). All MIT.
    "tree-sitter>=0.26",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-java>=0.23.5",
]

# The tools this component runs are deliberately not dependencies: Roseau for
# the Maven API diff, and actionlint, hadolint and kubeconform for validation,
# run as pinned images or archives with their versions recorded on every
# verdict, the way C3 runs Semgrep. Libraries it imports join here in the
# commit that first uses them.

[tool.uv.sources]
sdlc-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["c4"]
