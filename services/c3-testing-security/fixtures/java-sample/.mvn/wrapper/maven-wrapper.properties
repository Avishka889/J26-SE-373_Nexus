# The Maven Wrapper. Maven itself is not installed on the machine this
# component is developed on, and the wrapper is how a Java build runs anyway:
# the script fetches the distribution named here on its first run and caches it
# under the sandbox's own home.
#
# No jar is committed. This wrapper script downloads `maven-wrapper.jar` from
# Maven Central at first run, which is what it exists for, so this repository
# carries a shell script and two URLs rather than a binary.
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.4/maven-wrapper-3.3.4.jar
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
