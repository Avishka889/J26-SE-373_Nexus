[project]
name = "sdlc-c1"
version = "0.1.0"
description = "Component 1: requirements analysis and design artefact generation"
requires-python = ">=3.12"
dependencies = [
    "sdlc-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # The model layer. Both providers are installed so switching between them is
    # a change to C1_MODEL alone: Anthropic is the workhorse, Groq's free tier
    # stays available for comparison runs.
    "pydantic-ai-slim[anthropic,google,groq,openrouter]>=1.0",
]

[tool.uv.sources]
sdlc-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["c1"]
