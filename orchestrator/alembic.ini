[alembic]
script_location = orchestrator/db/migrations
prepend_sys_path = .
# Alembic 1.18 deprecated splitting this on spaces, commas and colons at once.
# Named explicitly because the suite turns warnings into errors, and the
# deprecation raised inside the conftest migration where it read as an
# unreachable database rather than as a configuration note.
path_separator = os
# The URL comes from the environment via env.py, never from this file, so a
# connection string cannot be committed by accident.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
