# Update pull requests run the whole CI like any other, and this repository's
# Actions minutes are metered, so updates come grouped: one pull request per
# ecosystem per run, not one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ai-sdlc-platform-frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ["*"]
