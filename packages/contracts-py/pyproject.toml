[project]
name = "sdlc-contracts"
version = "0.1.0"
description = "Artefact contracts shared by the orchestrator and every component service"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_contracts"]
